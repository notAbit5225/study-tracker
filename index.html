<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#221810" />
    <title>Desk</title>

    <!-- Runs before anything is drawn, so a cream-mode user never sees a flash
         of dark (or vice versa). The real value comes from settings later. -->
    <script>
      try {
        var t = localStorage.getItem('desk-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>

    <!-- Fonts:
         Young Serif  – warm old-style serif for headings and the big timer digits
         Figtree      – clean, readable body text
         Noto Serif/Sans Georgian – the browser falls back to these per-letter
         whenever you type Georgian, so notes look right in both alphabets. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Noto+Sans+Georgian:wght@400;600&family=Noto+Serif+Georgian:wght@400;600&family=Young+Serif&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
